name: M16 baseline viewport evidence
on:
  pull_request:
    paths:
      - 'docs/M16_BASELINE_AND_FEATURE_PARITY.md'
      - 'tests/m16-baseline-capture.mjs'
      - '.github/workflows/m16-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged six-tab baseline source
        run: |
          node --check tests/m16-baseline-capture.mjs
          node --test tests/*.test.mjs
      - name: Verify the published GitHub Pages baseline without changing it
        shell: bash
        run: |
          set -euo pipefail
          LIVE="https://hdog960.github.io/BO2-map"
          for asset in index.html app.js data.js sw.js; do
            curl -fsSL --retry 3 --max-time 25 "$LIVE/$asset" -o "/tmp/m16-pages-$asset"
            if ! cmp -s "$asset" "/tmp/m16-pages-$asset"; then
              echo "PUBLISHED_PAGES_MISMATCH: $asset differs from checked-out protected main source"
              exit 1
            fi
            echo "Published Pages matches baseline: $asset"
          done
          echo "M16_PAGES_BASELINE_MATCH"
      - name: Capture genuine Chromium baselines at all five viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/m16-http-server.log 2>&1 &
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then echo "Chromium not present"; exit 1; fi
          export CHROME_BIN
          sleep 1
          node tests/m16-baseline-capture.mjs
          test -f m16-baseline-evidence/baseline-layout.json
      - name: Upload baseline viewport captures and layout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-baseline-five-viewports
          path: m16-baseline-evidence/
          if-no-files-found: warn
          retention-days: 30
