<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TranZit UI acceptance test</title>
<style>body{font-family:system-ui;background:#101b23;color:white}iframe{width:400px;height:700px;border:1px solid #888}#result{font-size:20px}</style></head>
<body><h1>TranZit UI acceptance</h1><div id="result">RUNNING</div><iframe src="../index.html" id="app" title="TranZit test"></iframe>
<script>
(function(){
 const frame=document.getElementById("app"),result=document.getElementById("result");
 const check=(ok,why)=>{if(!ok)throw new Error(why);};
 frame.addEventListener("load",async()=>{
  try{
   const doc=frame.contentDocument,win=frame.contentWindow;
   check(!!doc,"iframe same origin");
   const click=selector=>{const el=doc.querySelector(selector);check(el,"Missing "+selector);el.dispatchEvent(new win.MouseEvent("click",{bubbles:true}));};
   check(doc.querySelector("#view-map").classList.contains("active"),"interactive map must be initial view");
   check(doc.querySelector("#mapLegend"),"map key must exist");
   check(doc.querySelectorAll("#mapLegend [data-map-key]").length===11,"all ten icon categories plus All");
   check(doc.querySelectorAll("#mapPins [data-group]").length>=12,"site-linked category pins should be shown without fake item coordinates");
   check(doc.querySelectorAll("#mapPins [data-zone]").length===10,"all ten mapped site pins");
   check(doc.querySelector("#worldMap image").getAttribute("href")==="./world-art.svg","reference vector artwork is present");
   check((await fetch("../world-art.svg")).ok,"local map artwork is served");

   // The scan runs on-device while the map remains interactive.
   check(doc.querySelector("#mapScanPanel").hidden,"scan should be closed by default");
   click("#openMapScan");
   check(!doc.querySelector("#mapScanPanel").hidden,"player can open map scanner");
   click("#startMapScan");
   check(win.TZ_SCAN?.active,"scan should start recording without blocking map");
   const sc=doc.querySelector("#mapViewport"),sr=sc.getBoundingClientRect();
   const sx=sr.left+sr.width*.48,sy=sr.top+sr.height*.45;
   const sp=(type,id,x,y)=>sc.dispatchEvent(new win.PointerEvent(type,{bubbles:true,pointerId:id,pointerType:"touch",isPrimary:id===871,clientX:x,clientY:y}));
   sp("pointerdown",871,sx,sy);sp("pointermove",871,sx+70,sy+35);sp("pointerup",871,sx+70,sy+35);
   sp("pointerdown",872,sx-40,sy);sp("pointerdown",873,sx+40,sy);
   sp("pointermove",873,sx+85,sy);sp("pointerup",873,sx+85,sy);sp("pointerup",872,sx-40,sy);
   check(win.TZ_SCAN.getStatus().moves>=2,"scan counts actual touch movements");
   click("#stopMapScan");
   const report=doc.querySelector("#mapScanReport").value;
   check(!win.TZ_SCAN.active,"scan stops after requested capture");
   check(report.includes("TRANZIT MAP PERFORMANCE SCAN v2"),"scan generates copyable text");
   check(report.includes("Pointer moves:"),"scan includes touch counts");
   check(report.includes("Median transform:"),"scan includes map update duration");
   check(report.includes("P95 frame interval:"),"scan includes frame pacing");
   check(!report.includes("Player 1"),"scan excludes game progress and player names");
   click("#closeMapScan");
   check(doc.querySelector("#mapScanPanel").hidden,"scan can be dismissed");
   click("#resetMap");


   // Interactive camera regression: world geometry zooms, on-map graphics do not.
   let fixedPin=doc.querySelector('#mapPins [data-zone="farm"] .site-pin');
   const fixedLabel=doc.querySelector('#mapLabels .fixed-world-label');
   check(fixedPin&&fixedLabel,"pin and fixed world label are present");
   const iconWidth=fixedPin.getBoundingClientRect().width;
   const labelHeight=fixedLabel.getBoundingClientRect().height;
   const terrain=doc.querySelector("#mapWorld");
   const root=doc.querySelector("#worldMap");
   const preWidth=root.getBoundingClientRect().width;
   click("#zoomIn");click("#zoomIn");
   fixedPin=doc.querySelector('#mapPins [data-zone="farm"] .site-pin');
   check(terrain.getAttribute("transform").includes("scale("),"zoom transforms terrain group");
   check(Math.abs(fixedPin.getBoundingClientRect().width-iconWidth)<1.2,"icon physical size must not grow on zoom");
   check(Math.abs(fixedLabel.getBoundingClientRect().height-labelHeight)<1.2,"map label physical size must stay fixed on zoom");
   check(Math.abs(root.getBoundingClientRect().width-preWidth)<1,"root SVG stays fixed when terrain zooms");
   const viewport=doc.querySelector("#mapViewport"),mapRect=viewport.getBoundingClientRect();
   const oldLeft=fixedPin.getBoundingClientRect().left;
   const send=(type,id,x,y)=>viewport.dispatchEvent(new win.PointerEvent(type,{bubbles:true,pointerId:id,pointerType:"touch",isPrimary:id===51,clientX:x,clientY:y}));
   const px=mapRect.left+mapRect.width*.53,py=mapRect.top+mapRect.height*.52;
   send("pointerdown",51,px,py);
   send("pointermove",51,px+65,py+28);
   send("pointerup",51,px+65,py+28);
   check(Math.abs(fixedPin.getBoundingClientRect().left-oldLeft)>12,"drag moves the world and its marker anchors");
   check(Math.abs(fixedPin.getBoundingClientRect().width-iconWidth)<1.2,"drag does not stretch the icon");
   const cameraBefore=terrain.getAttribute("transform");
   send("pointerdown",61,px-45,py);
   send("pointerdown",62,px+45,py);
   send("pointermove",62,px+90,py);
   send("pointerup",62,px+90,py);
   send("pointerup",61,px-45,py);
   check(terrain.getAttribute("transform")!==cameraBefore,"pinch gesture updates the world camera");
   fixedPin=doc.querySelector('#mapPins [data-zone="farm"] .site-pin');
   check(Math.abs(fixedPin.getBoundingClientRect().width-iconWidth)<1.2,"pinch zoom keeps icons a fixed size");
   check(Math.abs(fixedLabel.getBoundingClientRect().height-labelHeight)<1.2,"pinch zoom keeps map labels fixed size");
   // Exercise Safari-style native TouchEvent stream; desktop pointer simulation alone
   // cannot validate the handling path used by iOS Home Screen apps.
   click("#resetMap");
   click("#zoomIn");click("#zoomIn"); // zoom > 1, with genuine room to pan
   const beforeNative=win.TZ_MAP_TELEMETRY();
   const nativeAnchor=terrain.getAttribute("transform");
   const touch=(identifier,x,y)=>({identifier,clientX:x,clientY:y});
   const nt=(type,touches,changed=touches)=>{
    const evt=new win.Event(type,{bubbles:true,cancelable:true});
    Object.defineProperty(evt,"touches",{value:touches});
    Object.defineProperty(evt,"changedTouches",{value:changed});
    viewport.dispatchEvent(evt);
   };
   nt("touchstart",[touch(7,px,py)]);
   nt("touchmove",[touch(7,px+48,py+15)]);
   nt("touchmove",[touch(7,px+94,py+38)]);
   nt("touchend",[],[touch(7,px+94,py+38)]);
   const afterNative=win.TZ_MAP_TELEMETRY();
   check(afterNative.nativeTouchHandled>=beforeNative.nativeTouchHandled+2,"native touch input must reach map");
   check(afterNative.panChanged>beforeNative.panChanged,"native drag must change camera, not merely count touches");
   check(terrain.getAttribute("transform")!==nativeAnchor,"native touch drag actually moves map");
   const initialNativeZoom=afterNative.zoom;
   nt("touchstart",[touch(8,px-32,py),touch(9,px+32,py)]);
   nt("touchmove",[touch(8,px-32,py),touch(9,px+82,py)]);
   nt("touchend",[],[touch(8,px-32,py),touch(9,px+82,py)]);
   check(win.TZ_MAP_TELEMETRY().zoom>initialNativeZoom,"native two-finger pinch zooms map");
   fixedPin=doc.querySelector('#mapPins [data-zone="farm"] .site-pin');
   check(Math.abs(fixedPin.getBoundingClientRect().width-iconWidth)<1.2,"native touch pinch keeps icon size constant");
   click("#resetMap");

   click('#mapPins [data-group="depot|perk"]');
   check(!doc.querySelector("#mapContext").hidden,"tapping a perk category opens location-index sheet");
   check(doc.querySelector("#mapContext").textContent.includes("Quick Revive"),"depot's real perk is in site list");
   click('#mapContext [data-map-item^="perk-depot-quick-revive"]');
   check(doc.querySelector("#mapContext").textContent.includes("Where:"),"individual item sheet contains real room description");
   click("#closeMapContext");
   check(doc.querySelector("#mapContext").hidden,"map sheet dismisses cleanly");
   click('[data-map-key="turbine"]');
   check(doc.querySelector('[data-map-key="turbine"]').getAttribute("aria-pressed")==="true","turbine category is active");
   check(doc.querySelectorAll('#mapPins [data-group$="|turbine"]').length>=3,"Turbine door category badges are linked to affected sites");
   click('[data-map-key="all"]');
   check(doc.querySelector('[data-map-key="all"]').getAttribute("aria-pressed")==="true","All resets map key");
   click('#mapPins [data-map-more="town"]');
   check(doc.querySelector("#mapContext").textContent.includes("Juggernog"),"Town's extra markers open full item list");
   click('#mapContext [data-map-item^="perk-town-juggernog"]');
   check(doc.querySelector("#mapContext").textContent.includes("2500"),"selected perk details include price");
   click("#mapFullScreen");
   check(doc.querySelector("#interactiveMap").classList.contains("map-expanded"),"map expands for closer inspection");
   click("#mapExit");
   check(!doc.querySelector("#interactiveMap").classList.contains("map-expanded"),"map exits expanded mode");
   check(doc.querySelector('nav button[data-view="quest"]').textContent.includes("EASTER EGG"),"walkthrough has own labeled tab");
   click('nav button[data-view="quest"]');
   check(doc.querySelector("#view-quest").classList.contains("active"),"Easter Egg opens independently from map");
   check(doc.querySelector("#view-quest h2").textContent.includes("Easter Egg Walkthrough"),"walkthrough heading");
   click('[data-side="richtofen"]');
   check(doc.querySelector("#questPanel").textContent.includes("Four-player simultaneous EMP throw"),"Richtofen checklist");
   click('[data-quest-done="0"]');
   check(doc.querySelector("#questPanel").textContent.includes("1/8"),"Richtofen progress check");
   click('[data-quest-zone="power"]');
   check(doc.querySelector("#view-map").classList.contains("active"),"Easter egg location button returns to map");
   check(doc.querySelector("#mapContext").textContent.includes("Power Station"),"correct map location sheet opens");
   click("#globalFind");
   check(doc.querySelector("#view-atlas").classList.contains("active"),"Find still opens");
   click('[data-quick-find="Jet Gun"]');
   check(doc.querySelector("#atlasItems").textContent.includes("Jet Gun"),"Jet Gun search returns results");
   const item=doc.querySelector('#atlasItems [data-show-item]');
   check(item,"search has item");
   item.click();
   check(doc.querySelector("#modal").open,"item details modal opens");
   click("#modal [data-find-on-map]");
   check(doc.querySelector("#view-map").classList.contains("active"),"search result links back to map");
   check(!doc.querySelector("#mapContext").hidden,"search result map selection opens its details");
   click('nav button[data-view="zones"]');
   const select=doc.querySelector("#zoneSelect");select.value="town";
   select.dispatchEvent(new win.Event("change",{bubbles:true}));
   check(doc.querySelector("#zonePlan").textContent.includes("Bank"),"Town site notes preserved");
   click('nav button[data-view="crew"]');
   check(doc.querySelectorAll("details.build-card[data-build]").length===9,"nine buildables preserved");
   click('[data-part="jet:0"]');
   check(JSON.parse(win.localStorage.getItem("tranzit-atlas-save-v1")).parts["jet:0"]===true,"part tracking persists");
   const legend=win.getComputedStyle(doc.querySelector(".legend-button"));
   check(parseFloat(legend.minHeight)>=44,"map legend uses phone-sized tap targets");
   result.textContent="TRANZIT_MAP_PASS";
  }catch(error){result.textContent="UI_FAIL: "+String(error&&error.message||error);document.body.setAttribute("data-failed","1");}
 });
})();
</script></body></html>
